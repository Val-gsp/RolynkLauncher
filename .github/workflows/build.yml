name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Security regression tests
        run: npm run test:security

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Build + publication GitHub (release brouillon)
        if: success()
        # electron-builder.yml déclare déjà publish: {provider: github, releaseType: draft} :
        # avec GH_TOKEN présent, `npm run dist` publie lui-même les installeurs, blockmaps et
        # latest*.yml directement sur la release brouillon du tag. Une étape séparée
        # (softprops/action-gh-release) faisait la même chose en parallèle sur les 3 OS de la
        # matrice, vers la MÊME release : les deux publications concurrentes se marchaient
        # dessus et faisaient disparaître des fichiers (dont latest.yml) selon l'ordre
        # d'arrivée. Un seul publieur suffit, c'est déjà celui-ci.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist
        shell: bash
